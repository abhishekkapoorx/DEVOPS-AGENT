# Alertmanager configuration fragment. Merge this receiver into the running
# Alertmanager configuration and reload Alertmanager after changing it.
route:
  receiver: incident-investigation-lab

receivers:
  - name: incident-investigation-lab
    webhook_configs:
      - url: http://host.docker.internal:8000/webhook/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/incident-webhook-token
