# Pinned kube-prometheus-stack values for a small kind laptop cluster.
grafana:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 768Mi}
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    secrets:
      - incident-webhook-token
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 250m, memory: 256Mi}
  config:
    global:
      resolve_timeout: 1m
    route:
      receiver: incident-investigation-webhook
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 30m
    receivers:
      - name: "null"
      - name: incident-investigation-webhook
        webhook_configs:
          - url: http://host.docker.internal:8000/webhook/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/incident-webhook-token/token

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false

defaultRules:
  create: false
