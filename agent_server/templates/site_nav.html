<header class="ui-site-header">
  <div class="ui-site-header-inner">
    <a class="ui-site-brand" href="/" aria-label="DevOps Agent home">
      <span class="ui-site-mark" aria-hidden="true">DA</span>
      <span>DevOps Agent</span>
    </a>
    <nav class="ui-site-links" aria-label="Primary navigation">
      <a class="ui-site-link" href="/docs/cli" {% if request.url.path.startswith('/docs/') %}aria-current="page"{% endif %}>Documentation</a>
      {% if authenticated %}
      <a class="ui-site-link" href="/investigations" {% if request.url.path.startswith('/investigations') %}aria-current="page"{% endif %}>Investigations</a>
      <a class="ui-site-link" href="/settings" {% if request.url.path.startswith('/settings') %}aria-current="page"{% endif %}>Integrations</a>
      <a class="ui-site-link" href="/account" {% if request.url.path.startswith('/account') %}aria-current="page"{% endif %}>Account</a>
      {% else %}
      <a class="ui-site-link" href="/login" {% if request.url.path == '/login' %}aria-current="page"{% endif %}>Sign in</a>
      {% endif %}
    </nav>
  </div>
</header>
