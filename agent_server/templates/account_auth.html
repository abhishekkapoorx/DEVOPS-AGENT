{% extends "base.html" %}

{% block content %}
<main class="ui-page-card" aria-labelledby="auth-title">
  <p class="ui-eyebrow">DevOps Agent / Account</p>
  <h1 id="auth-title" class="ui-title">{{ title }}</h1>
  {% if message %}<p class="ui-notice" role="alert">{{ message }}</p>{% endif %}
  <p class="ui-intro">Use your self-hosted account to approve this device sign-in.</p>
  <nav class="mb-5 flex gap-5 border-b border-border-default" aria-label="Account actions">
    <a class="relative pb-2.5 text-muted no-underline hover:text-brand-hover aria-[current=page]:text-ink after:absolute after:right-0 after:bottom-[-1px] after:left-0 after:h-0.5 after:bg-brand aria-[current=page]:after:content-['']" href="{{ signin_url }}" {% if mode == "signin" %}aria-current="page"{% endif %}>Sign in</a>
    <a class="relative pb-2.5 text-muted no-underline hover:text-brand-hover aria-[current=page]:text-ink after:absolute after:right-0 after:bottom-[-1px] after:left-0 after:h-0.5 after:bg-brand aria-[current=page]:after:content-['']" href="{{ signup_url }}" {% if mode == "signup" %}aria-current="page"{% endif %}>Create account</a>
  </nav>
  <form method="post" action="{{ action_url }}">
    <input type="hidden" name="user_code" value="{{ user_code }}">
    <input type='hidden' name='mode' value='{{ mode }}'>
    <label class="ui-field">Email address
      <input class="ui-input" type="email" name='email' autocomplete="email" placeholder="you@example.com" required maxlength="254">
    </label>
    <label class="ui-field">Password
      <input class="ui-input" type="password" name="password" autocomplete="{{ password_autocomplete }}" required minlength="12" maxlength="1024">
      <span class="ui-hint">{{ password_hint }}</span>
    </label>
    <button class="ui-button" type="submit">{{ submit_label }}</button>
  </form>
  <p class="ui-fine-print">Email verification and password recovery are not configured.</p>
</main>
{% endblock %}
