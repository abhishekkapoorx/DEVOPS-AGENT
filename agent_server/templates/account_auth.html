<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ title }} | DevOps Agent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #0A0B0D;
      --bg-raised: #111317;
      --bg-inset: #07080A;
      --bg-overlay: #171A1F;
      --border-subtle: #1E2229;
      --border-default: #2A2F38;
      --border-strong: #3A414D;
      --text-primary: #E8EAED;
      --text-secondary: #9AA1AC;
      --text-muted: #858C98;
      --accent: #4F8CFF;
      --accent-hover: #6FA0FF;
      --accent-active: #3A74E6;
      --accent-subtle: rgba(79, 140, 255, 0.12);
      --danger: #FF5C6C;
      --danger-subtle: rgba(255, 92, 108, 0.12);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg-base); }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg-base);
      color: var(--text-primary);
      font: 400 14px/1.5 Inter, system-ui, sans-serif;
    }
    .auth-card {
      width: min(100%, 420px);
      padding: 24px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-raised);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--text-muted);
      font: 500 11px/1.4 ui-monospace, monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .intro { margin: 0 0 20px; color: var(--text-secondary); }
    .notice {
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 92, 108, 0.35);
      border-left: 3px solid var(--danger);
      background: var(--danger-subtle);
      color: var(--text-primary);
    }
    .account-tabs {
      display: flex;
      gap: 20px;
      margin: 0 0 20px;
      border-bottom: 1px solid var(--border-default);
    }
    .account-tabs a {
      position: relative;
      padding: 0 0 10px;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .account-tabs a:hover { color: var(--accent-hover); }
    .account-tabs a[aria-current="page"] { color: var(--text-primary); }
    .account-tabs a[aria-current="page"]::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: var(--accent);
      content: "";
    }
    .field {
      display: block;
      margin: 0 0 16px;
      color: var(--text-primary);
      font-weight: 500;
    }
    .field input {
      display: block;
      width: 100%;
      height: 44px;
      margin-top: 6px;
      padding: 0 12px;
      border: 1px solid var(--border-default);
      border-radius: 0;
      background: var(--bg-inset);
      color: var(--text-primary);
      font: 400 14px Inter, system-ui, sans-serif;
      transition: border-color 140ms ease-out;
    }
    .field input::placeholder { color: var(--text-muted); }
    .field input:hover { border-color: var(--border-strong); }
    .field input:focus-visible {
      border-color: var(--accent);
      outline: 1px solid var(--accent);
      outline-offset: 1px;
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    .hint { display: block; margin-top: 5px; color: var(--text-muted); font-size: 12px; font-weight: 400; }
    button {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--accent);
      border-radius: 0;
      background: var(--accent);
      color: var(--bg-base);
      font: 500 14px Inter, system-ui, sans-serif;
      cursor: pointer;
      transition: background 140ms ease-out, border-color 140ms ease-out;
    }
    button:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    button:active { background: var(--accent-active); }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .fine-print {
      margin: 16px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 12px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .auth-card { padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="auth-card" aria-labelledby="auth-title">
    <p class="eyebrow">DevOps Agent / Account</p>
    <h1 id="auth-title">{{ title }}</h1>
    {% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
    <p class="intro">Use your self-hosted account to approve this device sign-in.</p>
    <nav class="account-tabs" aria-label="Account actions">
      <a href="{{ signin_url }}" {% if mode == "signin" %}aria-current="page"{% endif %}>Sign in</a>
      <a href="{{ signup_url }}" {% if mode == "signup" %}aria-current="page"{% endif %}>Create account</a>
    </nav>
    <form method="post" action="{{ action_url }}">
      <input type="hidden" name="user_code" value="{{ user_code }}">
      <input type="hidden" name='mode' value='{{ mode }}'>
      <label class="field">Email address
        <input type="email" name='email' autocomplete="email" placeholder="you@example.com" required maxlength="254">
      </label>
      <label class="field">Password
        <input type="password" name="password" autocomplete="{{ password_autocomplete }}" required minlength="12" maxlength="1024">
        <span class="hint">{{ password_hint }}</span>
      </label>
      <button type="submit">{{ submit_label }}</button>
    </form>
    <p class="fine-print">Email verification and password recovery are not configured.</p>
  </main>
</body>
</html>
