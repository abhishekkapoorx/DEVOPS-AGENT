{% extends "settings_base.html" %}
{% block settings_content %}
<main class="ui-page-card ui-page-card-wide" aria-labelledby="account-title">
  <p class="ui-eyebrow">DevOps Agent / Account</p>
  <h1 id="account-title" class="ui-title">Your account</h1>
  <p class="ui-intro">Manage the profile details associated with your incident workspace.</p>
  {% if message %}<p class="ui-notice" role="alert">{{ message }}</p>{% endif %}
  <form method="post" action="/account">
    <label class="ui-field">Email address
      <input class="ui-input" type="email" value="{{ account.email }}" disabled>
      <span class="ui-hint">Your email is used as your account identifier and cannot be changed here.</span>
    </label>
    <label class="ui-field">Display name
      <input class="ui-input" name="display_name" value="{{ account.display_name or '' }}" placeholder="Your name" maxlength="120" autocomplete="name">
      <span class="ui-hint">This is optional and can be changed at any time.</span>
    </label>
    <button class="ui-button" type="submit">Save account details</button>
  </form>
  <p class="ui-fine-print">Account created {{ account.created_at or "not available" }}.</p>
</main>
{% endblock %}
