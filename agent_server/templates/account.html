{% extends "settings_base.html" %}
{% block settings_content %}
<main class="page-card wide" aria-labelledby="account-title">
  <p class="eyebrow">DevOps Agent / Account</p>
  <h1 id="account-title">Your account</h1>
  <p class="intro">Manage the profile details associated with your incident workspace.</p>
  {% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
  <form method="post" action="/account">
    <label class="field">Email address
      <input type="email" value="{{ account.email }}" disabled>
      <span class="hint">Your email is used as your account identifier and cannot be changed here.</span>
    </label>
    <label class="field">Display name
      <input name="display_name" value="{{ account.display_name or '' }}" placeholder="Your name" maxlength="120" autocomplete="name">
      <span class="hint">This is optional and can be changed at any time.</span>
    </label>
    <button type="submit">Save account details</button>
  </form>
  <p class="fine-print">Account created {{ account.created_at or "not available" }}.</p>
</main>
{% endblock %}
