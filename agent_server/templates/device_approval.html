{% extends "base.html" %}

{% block content %}
<main class="page-card" aria-labelledby="page-title">
  <p class="eyebrow">DevOps Agent / Device approval</p>
  <h1 id="page-title">Development sign-in</h1>
  <p class="intro">Approve sign-in for <strong>{{ user_id }}</strong> using code <strong>{{ user_code }}</strong>.</p>
  <form method="post" action="{{ action_url }}">
    <input type="hidden" name="user_code" value="{{ user_code }}">
    <div class="button-row">
      <button type="submit" name="decision" value="approve">Approve</button>
      <button class="secondary" type="submit" name="decision" value="deny">Deny</button>
    </div>
  </form>
</main>
{% endblock %}
