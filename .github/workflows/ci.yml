name: CI

on:
  push:
  pull_request:

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devops_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devops_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/devops_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and security scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cli,server,test]" pip-audit
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Upgrade and rollback migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Audit dependencies
        run: python -m pip_audit
