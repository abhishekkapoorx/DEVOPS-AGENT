services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devops_agent
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  tool-service:
    build: .
    env_file: .env
    command: ["uvicorn", "agent_server.tool_main:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "agent_server.api_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      tool-service:
        condition: service_healthy

volumes:
  postgres-data:
