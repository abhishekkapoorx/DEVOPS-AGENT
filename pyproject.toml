[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "0.1.0"
description = "Local DevOps CLI and tool helper"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cli = [
    "keyring>=25,<27",
    "pydantic>=2.11,<3",
    "textual>=8.2,<9",
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
devops-agent = "agent_cli.__main__:main"
devops-agent-tools = "agent_cli.tool_service:main"

[tool.setuptools.packages.find]
include = ["agent_protocol*", "agent_cli*"]

[tool.setuptools.package-data]
agent_cli = ["bin/*/*.exe", "bin/*/LICENSE*", "bin/*/UNLICENSE*"]

