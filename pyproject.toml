[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-agent"
version = "0.1.0"
description = "Local DevOps CLI and tool helper"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cli = [
    "keyring>=25,<27",
    "pydantic>=2.11,<3",
    "textual>=8.2,<9",
]
server = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.119,<1",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-google-genai>=3,<4",
    "langchain-groq>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[project.scripts]
devops-agent = "agent_cli.__main__:main"
devops-agent-tools = "agent_cli.tool_service:main"

[tool.setuptools.packages.find]
include = ["agent_protocol*", "agent_cli*"]

[tool.setuptools.package-data]
agent_cli = ["bin/*/*.exe", "bin/*/LICENSE*", "bin/*/UNLICENSE*"]

